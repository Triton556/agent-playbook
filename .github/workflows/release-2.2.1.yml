name: Publish 2.2.1
on:
  workflow_run:
    workflows: [Validate package]
    types: [completed]
    branches: [main]
permissions: {}
concurrency:
  group: release-2.2.1
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Triton556/agent-playbook' && github.event.workflow_run.head_repository.full_name == 'Triton556/agent-playbook' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the authorized immutable 2.2.1 release
        uses: actions/github-script@v7
        with:
          script: |
            const owner = 'Triton556', repo = 'agent-playbook', tag = 'v2.2.1';
            const run = context.payload.workflow_run;
            if (context.repo.owner !== owner || context.repo.repo !== repo ||
                run?.head_repository?.full_name !== `${owner}/${repo}` ||
                run.head_branch !== 'main' || run.event !== 'push' ||
                run.name !== 'Validate package' || run.conclusion !== 'success') {
              throw new Error('Not the authorized successful main validation event');
            }
            const sha = run.head_sha;
            if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error('Invalid validated commit');
            const main = await github.rest.git.getRef({owner, repo, ref: 'heads/main'});
            if (main.data.object.sha !== sha) throw new Error('Main moved after validation; no publication');
            const file = await github.rest.repos.getContent({owner, repo, path: 'manifest.json', ref: sha});
            const manifest = JSON.parse(Buffer.from(file.data.content, 'base64').toString('utf8'));
            if (manifest.version !== '2.2.1') { core.info('Not version 2.2.1; one-version publisher skipped'); return; }
            const maybe = async (fn) => { try { return await fn(); } catch (error) { if (error.status === 404) return null; throw error; } };
            let existingTag = await maybe(() => github.rest.git.getRef({owner, repo, ref: `tags/${tag}`}));
            if (existingTag && (existingTag.data.object.type !== 'commit' || existingTag.data.object.sha !== sha)) {
              throw new Error('Existing tag differs; refusing to overwrite');
            }
            const release = await maybe(() => github.rest.repos.getReleaseByTag({owner, repo, tag}));
            if (release) {
              if (!existingTag || release.data.tag_name !== tag || release.data.draft || release.data.prerelease) {
                throw new Error('Existing release is not the expected published stable release');
              }
              core.info(`Verified existing ${tag}: ${release.data.html_url}`);
              return;
            }
            const freshMain = await github.rest.git.getRef({owner, repo, ref: 'heads/main'});
            if (freshMain.data.object.sha !== sha) throw new Error('Main moved before publication');
            if (!existingTag) await github.rest.git.createRef({owner, repo, ref: `refs/tags/${tag}`, sha});
            await github.rest.repos.createRelease({owner, repo, tag_name: tag, target_commitish: sha,
              name: 'Agent Playbook 2.2.1', draft: false, prerelease: false,
              body: '## Changes\n- Clarify KB curation: INDEX-first reading, material extraction and existing-section/new-subsection/new-leaf routing.\n- Preserve source meaning, immutable originals and partially processed records without a mandatory per-item ledger.\n- Keep page-size thresholds in one shared reference. No new skills, examples or automatic whole-vault reads.\n\n## Installation\n[Installation and upgrade](https://github.com/Triton556/agent-playbook/blob/v2.2.1/docs/CLEAN_INSTALL_FOR_AGENTS.md). Update your existing installation with its original receipt and settings, then restart the agent session. Existing knowledge data is not rewritten.\n\n## Verification\nLinux and Windows package/installer/helper checks passed for this exact commit. kb-curate is 3862 UTF-8 bytes; the KB instruction set grows 6.5% against 2.2.0. This is byte accounting, not measured token usage or a model-quality benchmark.'});
